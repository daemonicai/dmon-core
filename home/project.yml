name: DmonHomeApp
options:
  bundleIdPrefix: ai.daemonic
  deploymentTarget:
    macOS: "14.0"
packages:
  DmonHome:
    path: .
targets:
  DmonHomeApp:
    type: application
    platform: macOS
    sources:
      - path: App/DmonHomeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.daemonic.dmon-home
        PRODUCT_NAME: DmonHomeApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: dmon-home
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: DmonHome
        product: Supervisor
      - package: DmonHome
        product: GatewayClient
      - package: DmonHome
        product: Power
